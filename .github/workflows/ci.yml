name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Системные пакеты
        run: sudo apt-get update && sudo apt-get install -y zstd pv shellcheck

      - name: Зависимости Python
        run: pip install -r requirements-dev.txt

      - name: shellcheck
        run: shellcheck -x -S warning backup.sh restore.sh tests/smoke.sh

      - name: Синтаксис Python
        run: python -m py_compile bu_config.py tui.py tg_upload.py

      - name: Тесты
        run: python -m pytest -q

      - name: Сквозной тест
        run: bash tests/smoke.sh
